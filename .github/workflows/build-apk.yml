No repositório stormlauncher-core (que contém stormlauncher-core.zip com o projeto Android Kotlin/Gradle build.gradle.kts, app/build.gradle.kts, gradle/libs.versions.toml e gradle/wrapper/gradle-wrapper.properties, sem script gradlew na raiz), configure ou atualize o workflow em .github/workflows/build-apk.yml para rodar em push (main) e workflow_dispatch no ubuntu-latest. Extraia stormlauncher-core.zip, configure o JDK 17 (Temurin) evitando android-actions/setup-android@v3 (que falhou anteriormente sob Node.js v24.22.1), execute gradle assembleDebug --stacktrace --info e envie o APK em app/build/outputs/apk/debug/*.apk como artifact stormlauncher-core-debug-apk. Se qualquer etapa falhar, não omita o log: exiba na saída o erro completo, o trecho exato da falha, os detalhes da stacktrace e uma explicação clara do porquê o erro aconteceu (ex.: ausência de gradlew, SDK/ambiente, dependência ou configuração Gradle). Faça apenas o que eu pedir, sem rodeios.
