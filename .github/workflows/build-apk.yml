name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract stormlauncher-core.zip
        run: |
          echo "=== Extraindo stormlauncher-core.zip ==="
          unzip -o stormlauncher-core.zip
          echo "=== Conteudo extraido ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verificar ambiente Java e Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          gradle -v

      - name: Build Debug APK
        id: build_apk
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Diagnóstico detalhado em caso de erro
        if: failure()
        run: |
          echo "=========================================="
          echo "FALHA NA COMPILACAO DO APK - RESUMO DO ERRO"
          echo "=========================================="
          if [ -f build.log ]; then
            grep -n -E "FAILURE:|What went wrong:|Execution failed|Caused by:|e: file://|ERROR:" build.log | tail -n 80 || true
            echo "------------------------------------------"
            echo "ULTIMAS 60 LINHAS DO LOG:"
            tail -n 60 build.log
          else
            echo "O erro ocorreu antes da etapa Build Debug APK (veja o passo que falhou acima)."
          fi

      - name: Listar APKs gerados
        if: success()
        run: |
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stormlauncher-core-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
