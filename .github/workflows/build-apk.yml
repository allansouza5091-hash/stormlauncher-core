
name: ZIP para APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Localizar e extrair ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Identificar projeto Android
        run: |
          if [ -f extracted/gradlew ]; then
            PROJECT="extracted"
          else
            GRADLEW=$(find extracted -name gradlew -type f | head -n 1)
            if [ -z "$GRADLEW" ]; then
              echo "ERRO: Projeto Gradle Android não encontrado."
              exit 1
            fi
            PROJECT=$(dirname "$GRADLEW")
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          chmod +x "$PROJECT/gradlew"

      - name: Compilar APK
        run: |
          cd "$PROJECT"
          ./gradlew assembleDebug --no-daemon

      - name: Localizar APK
        run: |
          mkdir -p output
          find "$PROJECT" -type f -name "*.apk" -exec cp {} output/ \;
          if [ -z "$(find output -name '*.apk' -print -quit)" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-android
          path: output/*.apk
          if-no-files-found: error
          
