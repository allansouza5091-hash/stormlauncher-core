
name: StormLauncher - Auto Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build StormLauncher APK
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o projeto
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Localizar Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      # 4. Instalar componentes Android
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Configurar Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. Gerar chave de desenvolvimento
      - name: Generate debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      # 7. Preparar Gradle Wrapper
      - name: Grant Gradle permissions
        run: chmod +x gradlew

      # 8. Verificar configuração
      - name: Check Gradle
        run: ./gradlew --version

      # 9. Compilar aplicativo
      - name: Build StormLauncher Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 10. Verificar APK
      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK gerado com sucesso!"
          ls -lh "$APK"

      # 11. Disponibilizar APK para download
      - name: Upload StormLauncher APK
        uses: actions/upload-artifact@v4
        with:
          name: StormLauncher-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
