name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract stormlauncher-core.zip
        run: |
          unzip -o stormlauncher-core.zip
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show error details if failed
        if: failure()
        run: |
          echo "=== DETALHES DO ERRO ==="
          grep -n -E "FAILURE:|What went wrong:|Execution failed|Caused by:|e: " build.log | tail -n 60 || true
          echo "=== ULTIMAS 40 LINHAS ==="
          tail -n 40 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stormlauncher-core-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
