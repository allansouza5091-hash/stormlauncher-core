
name: StormLauncher - Auto Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build StormLauncher APK
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurar Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 4. Instalar pacotes Android
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: SDK Manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Configurar Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 6. Encontrar automaticamente a pasta correta do projeto
      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            if [ -f "$DIR/app/build.gradle.kts" ] || [ -f "$DIR/app/build.gradle" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -not -path "*/.git/*" \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*"
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Repository files:"
            find . -maxdepth 5 -type f | head -n 150
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      # 7. Gerar chave de assinatura de depuração
      - name: Generate debug keystore
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          echo "Debug keystore ready."

      # 8. Verificar Gradle
      - name: Verify Gradle
        shell: bash
        run: |
          gradle --version
          test -f "$PROJECT_DIR/settings.gradle.kts" || test -f "$PROJECT_DIR/settings.gradle"

      # 9. Compilar APK
      - name: Build StormLauncher APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --stacktrace

      # 10. Verificar se o APK foi criado
      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Searching for generated APK files..."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK successfully generated!"
          ls -lh "$APK"

      # 11. Disponibilizar APK para download
      - name: Upload StormLauncher APK
        uses: actions/upload-artifact@v4
        with:
          name: StormLauncher-Android-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 14
          
